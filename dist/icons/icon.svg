<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#060810"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Palette body -->
  <ellipse cx="64" cy="66" rx="36" ry="30" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>

  <!-- Thumb hole -->
  <circle cx="80" cy="76" r="7" fill="#060810" stroke="#6366f1" stroke-width="1"/>

  <!-- Color dots -->
  <circle cx="44" cy="58" r="6" fill="#ff7ab2"/>
  <circle cx="58" cy="48" r="6" fill="#6366f1"/>
  <circle cx="72" cy="50" r="6" fill="#00f0ff"/>
  <circle cx="82" cy="58" r="6" fill="#d4a017"/>
  <circle cx="52" cy="70" r="6" fill="#22c55e"/>
  <circle cx="68" cy="68" r="5" fill="#e63946"/>

  <!-- Sparkle top-right -->
  <g transform="translate(96, 24)" opacity="0.9">
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#f1f5f9" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#f1f5f9" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Small sparkle bottom-left -->
  <g transform="translate(24, 96)" opacity="0.6">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
